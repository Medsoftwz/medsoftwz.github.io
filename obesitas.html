<b>Middelomtrek - Buikomvang = maat voor abdominale adipositas.</b>

* breng een meetlint aan rond je middel, op de blote huid en adem rustig uit;
* trek het meetlint niet te strak aan;
* let op de juiste plek: meet de buikomvang tussen de onderste rib en de bovenkant van je bekken, bij de meeste mensen is dit net boven de navel.

Klassieke referentiewaarden voor middelomtrek:
Mannen: < 94 cm; 94-101 cm verhoogd risico; ≥ 102 cm sterk verhoogd risico
Vrouwen: < 80 cm; 80-87 cm verhoogd risico; ≥ 88 cm sterk verhoogd risico
Opmerking: deze waarden houden geen rekening met de lichaamslengte.

<span class="rood">WHtR corrigeert de buikomtrek door rekening te houden met de lichaaamslengte.
<span class="groen">Vuistregel: middelomtrek < 50% van de lichaamslengte.</span>
`;

const INFO_WHTR = `
<b>WHtR (Waist-to-Height Ratio)</b>
WHtR = middelomtrek gedeeld door lichaamslengte.
Voorbeeld: Middelomtrek 95 cm; Lengte 175 cm; WHtR = 95 / 175 = 0,54

Interpretatie:
< 0,40 : mogelijk ondergewicht
0,40 - 0,49 : normaal risico
0,50 - 0,59 : verhoogd cardiometabool risico
≥ 0,60 : sterk verhoogd risico

<span class="groen">Praktische vuistregel: de buikomtrek zou minder dan de helft van de lichaamslengte moeten bedragen en dus de WHR zou minder dan 0,50 moeten zijn.</span>
`;

const INFO_BMI = `
<b>BMI (Body Mass Index)</b>

BMI = gewicht (kg) / lengte² (m²)
Voorbeeld: 90 kg - 1,80 m - BMI = 27,8

Volwassenen:
< 18,5 : ondergewicht
18,5 - 24,9 : normaal gewicht
25,0 - 29,9 : overgewicht
≥ 30,0 : obesitas

De BMI houdt geen rekening met vetverdeling, spiermassa of middelomtrek.
Daarom geeft WHtR een meer correct resultaat. 
`;

<div class="box">
<b>Nieuwe benadering van obesitas</b><br>

<p>
Traditioneel werd obesitas voornamelijk gedefinieerd op basis van de Body Mass Index (BMI). In de recente benadering ligt de nadruk niet alleen op de hoeveelheid lichaamsvet maar vooral op de aanwezigheid van gezondheidsproblemen die verband houden met overtollige adipositas.	
</p>

<p>
Van <b>preklinische obesitas</b> spreekt men wanneer overtollige adipositas aanwezig is, maar er nog geen aanwijzingen zijn voor obesitasgerelateerde orgaandisfunctie of functionele beperkingen. Deze toestand houdt een verhoogd risico in op het ontwikkelen van klinische obesitas en andere gezondheidsproblemen in de toekomst.	
</p>

<p>
Er is sprake van <b>klinische obesitas</b> wanneer overtollige adipositas leidt tot orgaandisfunctie, chronische ziekte en/of functionele beperkingen, zoals bijvoorbeeld type 2\-diabetes, slaapapneu, hartfalen, obesitasgerelateerde artrose of een verminderde fysieke zelfredzaamheid.<br>
<span class="bruin">Om tot een volledige diagnose te komen, moet dan ook tab 3 en tab 4 van dit formulier worden ingevuld.</span>
</p>

/* =====================================================
   popup
===================================================== */

function showInfo(text){
  document.getElementById("infoText").innerHTML = text;
  document.getElementById("infoModal").style.display = "block";
}

function closeInfo(){
  document.getElementById("infoModal").style.display = "none";
}

window.addEventListener("load",function(){
  document.getElementById("infoModal")
    .addEventListener("click",function(e){
      if(e.target===this){
        closeInfo();
      }
    });
});


/* =====================================================
   TAB
===================================================== */

function openTab(id,button){

document
.querySelectorAll(".tab-content")
.forEach(t => t.classList.remove("active"));

document
.querySelectorAll(".tablink")
.forEach(t => t.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

button.classList.add("active");

/* Naar boven scrollen */

window.scrollTo({
    top: 0,
    behavior: "smooth"
});

}

/* =====================================================
   Bereken
===================================================== */
function berekenAntropometrie(){

const gewicht =
parseFloat(
document.getElementById("gewicht").value
);

const lengte =
parseFloat(
document.getElementById("lengte").value
);

const middel =
parseFloat(
document.getElementById("middel").value
);

if(!gewicht || !lengte){
    return;
}

const lengteMeter = lengte / 100;

const bmi =
gewicht / (lengteMeter * lengteMeter);

document.getElementById("bmiResult").innerHTML =
bmi.toFixed(1);

let whtr = null;

if(middel){
    whtr = middel / lengte;
    document.getElementById("whtrResult").innerHTML =
    whtr.toFixed(2);
    document.getElementById("whtrDecision").innerHTML =
    whtr >= 0.50 ? "Ja" : "Nee";
}

document.getElementById("bmiDecision").innerHTML =
bmi >= 30 ? "Ja" : "Nee";

/* GEEN afgeronde schermwaarde gebruiken */

const adipositas =
(bmi >= 30)
||
(whtr !== null && whtr >= 0.50);

document.getElementById("adipositasResult").innerHTML =
adipositas ? "Ja" : "Nee";

/* Overgewicht bepalen */

let gewichtStatus = "";

if(bmi < 25){
    gewichtStatus = "Normaal gewicht";
}

else if(bmi < 30){
    gewichtStatus = "Overgewicht";
}

else{
    gewichtStatus = "Obesitas";
}

updateResult(adipositas, gewichtStatus);

}

/* =====================================================
   RESULTAAT
===================================================== */

function updateResult(adipositas, gewichtStatus){

const orgaan =
document.querySelectorAll(".orgaan:checked").length > 0;

const functie =
document.querySelectorAll(".functie:checked").length > 0;

let diagnose = "";

if(!adipositas){
    diagnose = gewichtStatus;

}
else if(!orgaan && !functie){
    diagnose = "Preklinische obesitas";

}
else{
    diagnose = "Klinische obesitas";

}

document.getElementById("diagnoseResult").innerHTML =
diagnose;

/* DOSSIERTEKST */

let tekst = "";

if(!adipositas){

    if(gewichtStatus==="Overgewicht"){
        tekst =
        "Er is overgewicht aanwezig maar er zijn momenteel onvoldoende criteria voor obesitas volgens het diagnostisch kader.";

    } else {
        tekst =
        "Normaal gewicht. Er zijn momenteel onvoldoende criteria voor obesitas volgens het diagnostisch kader.";
    }

}
else if(!orgaan && !functie){

    tekst =
    "Er werd overtollige adipositas vastgesteld op basis van antropometrische parameters. Er werden geen obesitasgerelateerde orgaandisfuncties of functionele beperkingen vastgesteld. Dit past bij preklinische obesitas.";

}
else{

    tekst =
    "Er werd overtollige adipositas vastgesteld. Tevens zijn obesitasgerelateerde orgaandisfuncties en/of functionele beperkingen aanwezig. Dit voldoet aan de criteria voor klinische obesitas.";

}

document.getElementById("dossierTekst").value =
tekst;

}

document.addEventListener("change", function(e){
    if(
        e.target.classList.contains("orgaan")
        ||
        e.target.classList.contains("functie")
    ){
        berekenAntropometrie();
    }
});
